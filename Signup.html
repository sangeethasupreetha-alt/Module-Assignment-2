<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="responsive page and validations">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <p>Already have an account? <a href="signin.html">Login</a></p>
    <a href="Travel App/travelapp.html">⬅ Go to Travel App</a>

    <div class="form-container">
        <h2>Create Account</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Full Name">
            <input type="text" id="email" placeholder="Email">
            <input type="text" id="phone" placeholder="Phone Number">
            <input type="text" id="city" placeholder="City">

            <div class="password-box">
                <input type="password" id="password" placeholder="password">
                <span onclick="togglePassword('password')"></span>
            </div>

            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <button type="submit">Signup</button>
            <p>Already have an account? <a href="Signin.html">Sign In</a></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
